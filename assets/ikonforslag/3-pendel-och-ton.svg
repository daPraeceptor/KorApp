<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#101018"/>

  <!-- Klangbågar i den rena stämningens gröna: appens andra halva, tongivningen.
       De utgår från pendelns vikt, som vore den tonens källa. -->
  <g fill="none" stroke="#5ee0b0" stroke-width="17" stroke-linecap="round">
    <path d="M356 196 A 92 92 0 0 1 356 316" opacity="0.9"/>
    <path d="M396 156 A 148 148 0 0 1 396 356" opacity="0.5"/>
  </g>

  <!-- Metronomens kropp, förenklad till en bred trapets -->
  <path d="M196 132 L286 132 L330 372 L152 372 Z"
        fill="#f2a65a" stroke="#f2a65a" stroke-width="24" stroke-linejoin="round"/>
  <rect x="136" y="370" width="210" height="32" rx="16" fill="#f2a65a"/>

  <!-- Pendeln, urskuren ur kroppen -->
  <line x1="241" y1="376" x2="292" y2="150" stroke="#101018" stroke-width="17" stroke-linecap="round"/>
  <g transform="rotate(-13 268 256)">
    <rect x="240" y="241" width="58" height="31" rx="9" fill="#101018"/>
  </g>
  <circle cx="241" cy="376" r="14" fill="#101018"/>
</svg>
