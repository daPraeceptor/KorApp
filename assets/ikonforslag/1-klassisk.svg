<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#101018"/>

  <!-- Metronomens kropp: den klassiska trapetsen. Rundade hörn via stroke. -->
  <path d="M200 108 L312 108 L370 388 L142 388 Z"
        fill="#f2a65a" stroke="#f2a65a" stroke-width="26" stroke-linejoin="round"/>
  <!-- Fot -->
  <rect x="126" y="386" width="260" height="34" rx="17" fill="#f2a65a"/>

  <!-- Skalans slits, urskuren ur kroppen -->
  <rect x="246" y="150" width="20" height="212" rx="10" fill="#101018" opacity="0.35"/>

  <!-- Pendeln, mörk mot den orange kroppen -->
  <line x1="256" y1="392" x2="322" y2="112" stroke="#101018" stroke-width="18" stroke-linecap="round"/>
  <!-- Vikten -->
  <g transform="rotate(-13 285 244)">
    <rect x="253" y="228" width="64" height="34" rx="10" fill="#101018"/>
  </g>
  <!-- Axeltappen -->
  <circle cx="256" cy="392" r="15" fill="#101018"/>
</svg>
