<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#101018"/>

  <g transform="translate(256 256) scale(1.2) translate(-257 -284)">
    <!-- Metronomens trekantiga kropp i bakgrunden, i dämpad orange så att
         gaffeln framför förblir huvudsaken. -->
    <path d="M150 414 L233 130 L279 130 L362 414 Z" fill="#f2a65a" opacity="0.18"/>
    <path d="M150 414 L233 130 L279 130 L362 414 Z"
          fill="none" stroke="#f2a65a" stroke-width="10" stroke-linejoin="round" opacity="0.35"/>

    <!-- Stämgaffeln som pendel, med en kula i skaftets ände — som på en
         riktig gaffel man håller i. Klykan behåller sin längd. -->
    <g transform="translate(256 398) rotate(15)">
      <line x1="0" y1="18" x2="0" y2="-80" stroke="#f2a65a" stroke-width="25" stroke-linecap="round"/>
      <!-- Klykan: två klor sammanbundna av en U-böj. Öppningen mellan klorna
           måste överleva nedskalning till favicon-storlek. -->
      <path d="M-37 -240 L-37 -128 Q-37 -92 0 -92 Q37 -92 37 -128 L37 -240"
            fill="none" stroke="#f2a65a" stroke-width="23"
            stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="0" cy="18" r="23" fill="#f2a65a"/>
    </g>
  </g>
</svg>
