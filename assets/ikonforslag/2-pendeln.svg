<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#101018"/>

  <!-- Svängbågen antyder rörelsen, så formen läses som en pendel och inte
       som en klubba. Dämpad så den inte konkurrerar med pendeln. -->
  <path d="M150 190 A 150 150 0 0 1 362 190"
        fill="none" stroke="#f2a65a" stroke-width="16" stroke-linecap="round" opacity="0.3"/>

  <!-- Pendeln -->
  <line x1="256" y1="398" x2="336" y2="150" stroke="#f2a65a" stroke-width="26" stroke-linecap="round"/>
  <!-- Vikten -->
  <circle cx="303" cy="252" r="46" fill="#f2a65a"/>
  <circle cx="303" cy="252" r="20" fill="#101018"/>
  <!-- Axeltappen med sin fot -->
  <rect x="186" y="384" width="140" height="30" rx="15" fill="#f2a65a"/>
  <circle cx="256" cy="398" r="20" fill="#101018"/>
</svg>
